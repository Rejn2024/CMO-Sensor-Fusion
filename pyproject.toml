[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmo-combat-id-calibration"
version = "0.1.0"
description = "Calibrate Graph DB-supported combat identification probabilities from CMO ground truth"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
graph = [
  "neo4j>=5",
  "pypdf>=4",
]
